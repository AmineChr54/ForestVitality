# GitLab CI/CD Pipeline for Forest Vitality
# This pipeline automates testing, building, and deployment

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # Image names
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

# ==================================
# Test Stage
# ==================================

test:backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install -r requirements.txt
  script:
    - echo "Running backend tests..."
    - pytest tests/
  only:
    - branches

test:frontend:
  stage: test
  image: node:18-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - echo "Running frontend linting..."
    - npm run lint
  only:
    - branches

# ==================================
# Build Stage
# ==================================

build:backend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $BACKEND_IMAGE:latest .
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  only:
    - main
    - develop
    - merge_requests

build:frontend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - docker build -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA -t $FRONTEND_IMAGE:latest .
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  only:
    - main
    - develop
    - merge_requests

# ==================================
# Deploy Stage
# ==================================


deploy:staging:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to staging environment..."
    - |
      ssh $PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_HOST << EOF
        cd /opt/forest-vitality
        # Export the image names so docker-compose can use them
        export BACKEND_IMAGE=$BACKEND_IMAGE:latest
        export FRONTEND_IMAGE=$FRONTEND_IMAGE:latest
        
        # Login to registry on the server (if private)
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        
        docker-compose -f infra/docker-compose.prod.yml pull
        docker-compose -f infra/docker-compose.prod.yml up -d
      EOF
  environment:
    name: staging
    url: http://staging.yourserver.com
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PRODUCTION_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to production environment..."
    - |
      ssh $PRODUCTION_SERVER_USER@$PRODUCTION_SERVER_HOST << EOF
        cd /opt/forest-vitality
        # Export the image names so docker-compose can use them
        export BACKEND_IMAGE=$BACKEND_IMAGE:latest
        export FRONTEND_IMAGE=$FRONTEND_IMAGE:latest
        
        # Login to registry on the server
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        
        docker-compose -f infra/docker-compose.prod.yml pull
        docker-compose -f infra/docker-compose.prod.yml up -d
      EOF
  environment:
    name: production
    url: http://yourserver.com
  only:
    - main
  when: manual
