version: "3"

tasks:
  dev:
    desc: Start all development services
    cmds:
      - task: docker
      - task: info
      - task: services

  docker:
    desc: Start Docker services
    cmd: docker-compose -f infra/docker-compose.yml up -d

  info:
    desc: Print service URLs
    silent: true
    cmd: |
      powershell -Command "
        Write-Host ''
        Write-Host '==================================================='
        Write-Host '  Forest Vitality - Development Services'
        Write-Host '==================================================='
        Write-Host ''
        Write-Host '  Frontend:        http://localhost:5173        (dev user: adminuser / admin123)'
        Write-Host '  Backend API:     http://localhost:8000/docs'
        Write-Host '  Keycloak:        http://localhost:8080        (User: admin, Pass: admin)'
        Write-Host '  OpenSearch:      http://localhost:9200        (Use DBeaver to visualize)'
        Write-Host '  MinIO Console:   http://localhost:9001        (User: admin, Pass: admin123)'
        Write-Host '  TiTiler Docs:    http://localhost:8082/api.html   (Tile Server API)'
        Write-Host ''
        Write-Host '==================================================='
        Write-Host ''
      "

  services:
    desc: Start backend and frontend in parallel
    deps: [backend, frontend]

  backend:
    desc: Start backend server
    dir: backend
    cmd: powershell -Command ".\.venv\Scripts\Activate.ps1; uvicorn backend_app.main:app --reload --host 0.0.0.0 --port 8000"

  frontend:
    desc: Start frontend dev server
    dir: frontend
    cmd: npm run dev

  test:backend:
    desc: Run backend tests (pytest)
    dir: backend
    cmd: powershell -Command ".\.venv\Scripts\Activate.ps1; pytest tests/ -q --tb=short"

  test:frontend:
    desc: Run frontend tests (vitest)
    dir: frontend
    cmd: npm test

  test:
    desc: Run all tests (backend + frontend)
    cmds:
      - task: test:backend
      - task: test:frontend

  stop:
    desc: Stop all Docker services
    cmd: docker-compose -f infra/docker-compose.yml stop
