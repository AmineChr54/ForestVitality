services:
  backend:
    image: ${BACKEND_IMAGE:-backend-prod:latest}
    container_name: backend-prod
    hostname: backend
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      opensearch:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - forest-net

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: opensearch-prod
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cat/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - forest-net

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db-prod
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - keycloak_db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forest-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak-prod
    restart: unless-stopped
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import
      - ./keycloak/themes/forest-vitality:/opt/keycloak/themes/forest-vitality
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - forest-net

  minio:
    image: minio/minio
    container_name: minio-prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - .env.prod
    volumes:
      - minio_data_prod:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - forest-net

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: titiler-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8000"
    env_file:
      - .env.prod
    environment:
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_DEFAULT_REGION: us-east-1
      AWS_VIRTUAL_HOSTING: "false"
      AWS_HTTPS: "NO"
      AWS_NO_SIGN_REQUEST: "NO"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff"
      GDAL_HTTP_UNSAFESSL: "YES"
      CORS_ORIGINS: "*"
      PORT: "8000"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - forest-net

networks:
  forest-net:
    driver: bridge

volumes:
  keycloak_db_data_prod:
  minio_data_prod:
