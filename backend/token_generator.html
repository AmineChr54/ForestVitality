<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Generator - Forest Vitality API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .quick-users {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 30px;
        }

        .quick-user-btn {
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .quick-user-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
            transform: translateY(-2px);
        }

        .quick-user-btn .role {
            font-size: 12px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .quick-user-btn .username {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
        }

        .token-info {
            margin-bottom: 15px;
        }

        .token-info strong {
            color: #333;
            display: block;
            margin-bottom: 5px;
        }

        .token-box {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #dee2e6;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .copy-btn:hover {
            background: linear-gradient(135deg, #5568d3 0%, #6a4190 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.copied {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            animation: pulse 0.4s ease;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .decoded-token {
            margin-top: 15px;
        }

        .decoded-token pre {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #dee2e6;
            max-height: 300px;
            overflow-y: auto;
            font-size: 11px;
        }

        .swagger-link {
            margin-top: 15px;
            text-align: center;
        }

        .swagger-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .swagger-link a:hover {
            text-decoration: underline;
        }

        .divider {
            margin: 25px 0;
            text-align: center;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #999;
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔐 Token Generator</h1>
        <p class="subtitle">Generate access tokens for testing the Forest Vitality API</p>

        <div class="quick-users">
            <button class="quick-user-btn" onclick="quickLogin(event, 'adminuser', 'admin123')">
                <div class="role">ADMINISTRATOR</div>
                <div class="username">adminuser</div>
            </button>
            <button class="quick-user-btn" onclick="quickLogin(event, 'forestanalyzer', 'forest123')">
                <div class="role">FOREST ANALYST</div>
                <div class="username">forestanalyzer</div>
            </button>
            <button class="quick-user-btn" onclick="quickLogin(event, 'datauser', 'data123')">
                <div class="role">DATA MANAGER</div>
                <div class="username">datauser</div>
            </button>
            <button class="quick-user-btn" onclick="quickLogin(event, 'viewuser', 'view123')">
                <div class="role">VIEWER</div>
                <div class="username">viewuser</div>
            </button>
        </div>

        <div class="divider"><span>OR ENTER CUSTOM CREDENTIALS</span></div>

        <form id="tokenForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn" id="submitBtn">Generate Token</button>
        </form>

        <div id="result" class="result">
            <div class="token-info">
                <strong>Access Token (expires in <span id="expiresIn"></span>):</strong>
                <div class="token-box" style="position: relative;">
                    <button class="copy-btn" id="copyBtn" onclick="copyToken()">
                        <span id="copyIcon">📋</span>
                        <span id="copyText">Copy Token</span>
                    </button>
                    <div id="tokenValue"></div>
                </div>
            </div>

            <div class="decoded-token">
                <strong>Decoded Token:</strong>
                <pre id="decodedToken"></pre>
            </div>

            <div class="swagger-link">
                <a href="http://localhost:8000/docs" target="_blank">Open Swagger UI →</a>
            </div>
        </div>
    </div>

    <script>
        const TOKEN_API = 'http://localhost:8000/api/generate-token';

        function quickLogin(event, username, password) {
            event.preventDefault();
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            document.getElementById('tokenForm').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
        }

        document.getElementById('tokenForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const result = document.getElementById('result');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating...';
            result.classList.remove('show', 'success', 'error');

            try {
                const response = await fetch(TOKEN_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                    }),
                });

                if (!response.ok) {
                    throw new Error('Authentication failed. Check your credentials.');
                }

                const data = await response.json();

                // Display token
                document.getElementById('tokenValue').textContent = data.access_token;
                document.getElementById('expiresIn').textContent = `${data.expires_in} seconds`;

                // Decode and display token
                const decoded = parseJwt(data.access_token);
                document.getElementById('decodedToken').textContent = JSON.stringify(decoded, null, 2);

                result.classList.add('show', 'success');

                // Store token in sessionStorage for potential use
                sessionStorage.setItem('access_token', data.access_token);

            } catch (error) {
                result.classList.add('show', 'error');
                document.getElementById('tokenValue').textContent = error.message;
                document.getElementById('decodedToken').textContent = '';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Token';
            }
        });

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                return JSON.parse(jsonPayload);
            } catch (e) {
                return { error: 'Failed to decode token' };
            }
        }

        function copyToken() {
            const tokenValue = document.getElementById('tokenValue').textContent;
            const btn = document.getElementById('copyBtn');
            const icon = document.getElementById('copyIcon');
            const text = document.getElementById('copyText');

            navigator.clipboard.writeText(tokenValue).then(() => {
                // Add copied class for green animation
                btn.classList.add('copied');
                icon.textContent = '✓';
                text.textContent = 'Copied!';

                // Reset after 2 seconds
                setTimeout(() => {
                    btn.classList.remove('copied');
                    icon.textContent = '📋';
                    text.textContent = 'Copy Token';
                }, 2000);
            }).catch(() => {
                // Fallback for clipboard errors
                icon.textContent = '❌';
                text.textContent = 'Failed';
                setTimeout(() => {
                    icon.textContent = '📋';
                    text.textContent = 'Copy Token';
                }, 2000);
            });
        }
    </script>
</body>

</html>
